<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Chatbot Assistant</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --me:#6366f1; --bot:#334155; --text:#e2e8f0; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text);
           display:flex; justify-content:center; min-height:100vh; }
    main { width:100%; max-width:720px; display:flex; flex-direction:column; padding:16px; gap:12px; }
    header { display:flex; justify-content:space-between; align-items:center; }
    h1 { font-size:1.2rem; margin:0; }
    #log { flex:1; background:var(--card); border-radius:16px; padding:16px; overflow-y:auto;
           display:flex; flex-direction:column; gap:10px; min-height:60vh; max-height:70vh; }
    .msg { padding:10px 14px; border-radius:14px; max-width:85%; white-space:pre-wrap; line-height:1.5; }
    .me { align-self:flex-end; background:var(--me); }
    .bot { align-self:flex-start; background:var(--bot); }
    form { display:flex; gap:8px; }
    input { flex:1; padding:12px 14px; border-radius:12px; border:0; background:var(--card); color:var(--text); font-size:1rem; }
    button { padding:12px 18px; border:0; border-radius:12px; background:var(--me); color:#fff; cursor:pointer; font-size:1rem; }
    button.ghost { background:transparent; border:1px solid var(--bot); }
    button:disabled { opacity:.5; cursor:not-allowed; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>AI Chatbot Assistant</h1>
    <button class="ghost" id="reset" type="button">New chat</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <input id="input" placeholder="Type your message..." autocomplete="off" required>
    <button id="send">Send</button>
  </form>
</main>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  let sessionId = null;

  function add(role, text) {
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    send.disabled = true;
    add("me", message);
    const bubble = add("bot", "...");
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, session_id: sessionId }),
      });
      sessionId = res.headers.get("X-Session-Id") || sessionId;
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      bubble.textContent = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        bubble.textContent += decoder.decode(value, { stream: true });
        log.scrollTop = log.scrollHeight;
      }
    } catch (err) {
      bubble.textContent = "Network error. Please try again.";
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  document.getElementById("reset").addEventListener("click", async () => {
    if (sessionId) {
      await fetch("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" },
                                  body: JSON.stringify({ session_id: sessionId }) });
    }
    sessionId = null;
    log.innerHTML = "";
  });
</script>
</body>
</html>
